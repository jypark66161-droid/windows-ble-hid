name: DeskBridge v0.15 Pairing-Safe Build
on:
  push:
    branches: [deskbridge-native-hogp-v15-pairing-safe-recovery]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standard multi-file release
        shell: pwsh
        run: dotnet publish native-hogp/DeskBridge.NativeHogp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:EnableWindowsTargeting=true -o release-multifile
      - name: Windows Defender scan
        shell: pwsh
        run: |
          $exe = (Resolve-Path "release-multifile/DeskBridge.NativeHogp.exe").Path
          $mp = "$env:ProgramFiles/Windows Defender/MpCmdRun.exe"
          if (!(Test-Path $mp)) { throw "Windows Defender CLI unavailable" }
          & $mp -Scan -ScanType 3 -File $exe -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Windows Defender scan failed" }
      - name: Store SHA256
        shell: pwsh
        run: (Get-FileHash release-multifile/DeskBridge.NativeHogp.exe -Algorithm SHA256).Hash | Set-Content release-multifile/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DeskBridge-v15-PairingSafe-Standard-Win64
          path: release-multifile/
          if-no-files-found: error
