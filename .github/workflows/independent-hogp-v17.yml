name: DeskBridge Independent HID Profiles
on:
  push:
    branches: [deskbridge-independent-hid-profiles-v17]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build independent HID prototype
        shell: pwsh
        run: dotnet publish independent-hogp/DeskBridge.IndependentHogp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:EnableWindowsTargeting=true -o independent-release
      - name: Package double-click experiments
        shell: pwsh
        run: |
          $p = 'independent-release'
          $cases = @(
            @('01-MouseOnly-Static.bat','--profile=mouse'),
            @('02-KeyboardOnly-Static.bat','--profile=keyboard'),
            @('03-Composite-Static.bat','--profile=composite'),
            @('04-MouseOnly-ReadHandlers.bat','--profile=mouse --read-handlers'),
            @('05-Composite-ReadHandlers.bat','--profile=composite --read-handlers')
          )
          foreach ($case in $cases) {
            $lines = @('@echo off','cd /d "%~dp0"',('DeskBridge.IndependentHogp.exe ' + $case[1]),'pause')
            $lines | Set-Content (Join-Path $p $case[0]) -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DeskBridge-v17-Independent-HID-Experiments-Win64
          path: independent-release/
          retention-days: 30
