name: DeskBridge BLE HID CLI

on:
  push:
    branches: [deskbridge-hid-recovery-license-20261015]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run core tests
        run: dotnet test tests/BleHid.Core.Tests/BleHid.Core.Tests.csproj -c Release

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64 CLI
        run: >
          dotnet publish src/BleHid.Cli/BleHid.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o artifacts/cli
      - name: Verify executable starts and reports x64
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/cli/BleHid.Cli.exe"
          $output = & $exe --self-test 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'launch OK' -or $output -notmatch 'process=X64') {
            throw "Published Windows x64 CLI did not launch successfully as x64"
          }
      - name: Include open-source license
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.md artifacts/cli
      - uses: actions/upload-artifact@v4
        with:
          name: DeskBridge_BLE_HID_CLI_WIN11_x64_build-${{ github.run_number }}
          path: artifacts/cli/*
          if-no-files-found: error
