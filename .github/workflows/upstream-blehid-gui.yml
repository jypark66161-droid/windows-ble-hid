name: Original BleHid Desktop GUI Standard
on:
  push:
    branches: [deskbridge-upstream-blehid-gui-standard]
  workflow_dispatch:
jobs:
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: abhishek-raj/windows-ble-hid
          ref: b33a0043b3865ea8251a242eae27aa2f72816512
          path: upstream
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build original WPF GUI self-contained
        shell: pwsh
        run: dotnet publish upstream/src/BleHid.App/BleHid.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:EnableWindowsTargeting=true -p:DebugType=none -o desktop
      - name: Validate executable and Defender scan
        shell: pwsh
        run: |
          $exe = (Resolve-Path desktop/BleHid.App.exe).Path
          if (!(Test-Path $exe)) { throw 'No GUI executable' }
          $mp = "$env:ProgramFiles/Windows Defender/MpCmdRun.exe"
          if (!(Test-Path $mp)) { throw "Defender scanner unavailable" }
          & $mp -Scan -ScanType 3 -File $exe -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender scan failed: $LASTEXITCODE" }
          (Get-FileHash $exe -Algorithm SHA256).Hash | Set-Content desktop/SHA256.txt
      - name: Include license and source attribution
        shell: pwsh
        run: |
          Copy-Item upstream/LICENSE desktop/LICENSE.txt
          'Original upstream GUI from abhishek-raj/windows-ble-hid commit b33a0043b3865ea8251a242eae27aa2f72816512. Extract all files and double click BleHid.App.exe. No external .NET runtime needed. Unsigned executable; browser/SmartScreen can still block.' | Set-Content desktop/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BleHid-Original-GUI-DoubleClick-Win64
          path: desktop/
          if-no-files-found: error
